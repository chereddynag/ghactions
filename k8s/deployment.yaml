apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghaction
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ghaction
  template:
    metadata:
      labels:
        app: ghaction
    spec:
      serviceAccountName: sre-cronjob-sa
      containers:
      - name: ghaction
        image: us-central1-docker.pkg.dev/project-753633bf-7369-418c-920/argocd/mydcoker:1.0
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80